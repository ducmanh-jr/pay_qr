<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QR TPBank - NGUYEN DUC MANH</title>
  
  <!-- Apple Touch Icon & Favicon -->
  <link rel="apple-touch-icon" href="https://img.vietqr.io/image/TPB-20262027202-qr_only.png">
  <link rel="icon" type="image/png" href="https://api.vietqr.io/img/TPB.png">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22QR%20TPBank%22%2C%22short_name%22%3A%22QR%20Pay%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23180933%22%2C%22theme_color%22%3A%22%232C124D%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fimg.vietqr.io%2Fimage%2FTPB-20262027202-qr_only.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #180933 0%, #3e1258 50%, #1a0836 100%);
      padding: 20px;
      color: #ffffff;
    }

    /* Thẻ hiển thị QR thuần túy, siêu tối giản */
    .qr-card {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 340px;
      text-align: center;
    }

    .account-name {
      font-size: 18px;
      font-weight: 800;
      color: #2C124D;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .account-number {
      font-size: 16px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 20px;
      letter-spacing: 1px;
      font-family: monospace;
      cursor: pointer;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 8px;
      transition: background 0.2s ease;
    }

    .account-number:active {
      background: rgba(44, 18, 77, 0.1);
    }

    .qr-image {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      display: block;
    }

    /* Thông báo Toast khi copy */
    .toast {
      position: fixed;
      bottom: 30px;
      background: #0f172a;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="qr-card">
    <div class="account-name">NGUYEN DUC MANH</div>
    <div class="account-number" onclick="copySTK()" title="Bấm để sao chép">2026 2027 202</div>
    <!-- Dùng mẫu qr_only: chỉ lấy đúng mã QR tinh gọn, không dính logo thừa hay chữ số tiền 0đ -->
    <img class="qr-image" src="https://img.vietqr.io/image/TPB-20262027202-qr_only.png" alt="Mã QR TPBank">
  </div>

  <div id="toast" class="toast">Đã sao chép số tài khoản!</div>

  <script>
    function copySTK() {
      navigator.clipboard.writeText("20262027202").then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }
  </script>
</body>
</html>
