<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>QR TPBank - NGUYEN DUC MANH</title>
  
  <link rel="apple-touch-icon" href="https://img.vietqr.io/image/TPB-20262027202-qr_only.png">
  <link rel="icon" type="image/png" href="https://api.vietqr.io/img/TPB.png">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22QR%20TPBank%22%2C%22short_name%22%3A%22QR%20Pay%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fimg.vietqr.io%2Fimage%2FTPB-20262027202-qr_only.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0d0d11;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px) 16px;
      color: #ffffff;
      position: relative;
      touch-action: pan-y;
      transition: background-image 0.4s ease-in-out;
      cursor: pointer;
    }

    /* Dark Vignette Overlay mỏng nhẹ để ảnh nền nổi bật nhất */
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0.55) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Wrapper chính giữ toàn bộ nội dung căn giữa */
    .main-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 360px;
      gap: 14px;
      user-select: none;
      animation: fadeIn 0.4s ease-out;
    }

    /* Tên chủ tài khoản đè trực tiếp lên ảnh nền */
    .account-name {
      font-size: 21px;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 0, 0, 0.7);
      text-align: center;
    }

    /* Số tài khoản đè trực tiếp lên ảnh nền */
    .account-number {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 2px;
      font-family: 'SF Mono', 'Roboto Mono', monospace;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }

    .account-number:active {
      transform: scale(0.95);
      background: rgba(0, 0, 0, 0.65);
    }

    /* Khung chứa mã QR nhỏ gọn nhất để không che ảnh nền */
    .qr-frame {
      background: #ffffff;
      padding: 10px;
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 220px;
      height: 220px;
      margin: 4px 0;
    }

    .qr-image {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      display: block;
      pointer-events: none;
    }

    /* Dots Indicator chuyển hình nền */
    .dots-container {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dot.active {
      width: 10px;
      height: 10px;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: calc(25px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Tối ưu kích thước trên màn hình Mi 11 Ultra */
    @media (min-height: 800px) {
      .main-wrapper { gap: 18px; }
      .account-name { font-size: 23px; }
      .account-number { font-size: 17px; padding: 8px 18px; }
      .qr-frame { width: 240px; height: 240px; padding: 12px; }
    }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>

  <div class="main-wrapper">
    <!-- Tên & Số tài khoản đè trực tiếp lên bức ảnh nền -->
    <div class="account-name">NGUYEN DUC MANH</div>
    
    <div class="account-number" onclick="copySTK(event)" title="Bấm để sao chép số tài khoản">
      <span>2026 2027 202</span>
      <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
    </div>

    <!-- Khung QR siêu nhỏ gọn để không che ảnh nền -->
    <div class="qr-frame">
      <img class="qr-image" src="https://img.vietqr.io/image/TPB-20262027202-qr_only.png" alt="Mã QR TPBank NGUYEN DUC MANH">
    </div>

    <!-- Dải chấm tròn chọn hình nền -->
    <div class="dots-container" id="dotsContainer"></div>
  </div>

  <div id="toast" class="toast">Đã sao chép số tài khoản!</div>

  <script>
    const wallpapers = [
      'img/954200239789131404.jpg',
      'img/454863631138731052.jpg',
      'img/bg_daisy.jpg',
      'img/759701030913767782.jpg',
      'img/971651688338996661.jpg',
      'img/973692381950275438.jpg',
      'img/800233427586822769.jpg',
      'img/935904366330998579.jpg',
      'img/790100328393841185.jpg',
      'img/935974735068844819.jpg',
      'img/1100145015255767390.jpg'
    ];

    let currentBgIndex = parseInt(localStorage.getItem('saved_bg_index') || '0', 10);
    if (isNaN(currentBgIndex) || currentBgIndex < 0 || currentBgIndex >= wallpapers.length) {
      currentBgIndex = 0;
    }

    function renderDots() {
      const c = document.getElementById('dotsContainer');
      c.innerHTML = '';
      wallpapers.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = `dot ${i === currentBgIndex ? 'active' : ''}`;
        d.onclick = e => { e.stopPropagation(); applyWallpaper(i); };
        c.appendChild(d);
      });
    }

    function applyWallpaper(i) {
      currentBgIndex = i;
      document.body.style.backgroundImage = `url('${wallpapers[i]}')`;
      localStorage.setItem('saved_bg_index', i.toString());
      renderDots();
    }

    function next() { applyWallpaper((currentBgIndex + 1) % wallpapers.length); }
    function prev() { applyWallpaper((currentBgIndex - 1 + wallpapers.length) % wallpapers.length); }

    // Vuốt màn hình sang trái / phải
    let sx = 0, sy = 0, swiped = false;
    document.addEventListener('touchstart', e => { sx = e.changedTouches[0].screenX; sy = e.changedTouches[0].screenY; swiped = false; });
    document.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].screenX - sx;
      const dy = e.changedTouches[0].screenY - sy;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
        swiped = true;
        dx < 0 ? next() : prev();
      }
    });

    // Chạm bên trái / bên phải màn hình
    document.addEventListener('click', e => {
      if (swiped) { swiped = false; return; }
      if (e.target.closest('.account-number') || e.target.closest('.dots-container')) return;
      e.clientX < window.innerWidth / 2 ? prev() : next();
    });

    // Bàn phím Mũi tên
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft') prev();
    });

    function copySTK(e) {
      if (e) e.stopPropagation();
      navigator.clipboard.writeText("20262027202").then(() => {
        const t = document.getElementById('toast');
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
      });
    }

    applyWallpaper(currentBgIndex);
  </script>
</body>
</html>
