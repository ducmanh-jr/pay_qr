<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>QR is Me - NGUYEN DUC MANH</title>
  
  <link rel="apple-touch-icon" href="logo.jpg">
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="shortcut icon" href="logo.jpg">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QR is Me">
  
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22QR%20is%20Me%22%2C%22short_name%22%3A%22QR%20is%20Me%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22logo.jpg%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fjpeg%22%7D%5D%7D">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #000000 !important;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      position: relative;
      touch-action: pan-y;
      cursor: pointer;
    }

    /* Khung Phone Frame mô phỏng Mi 11 Ultra */
    .phone-frame {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 24px) 16px env(safe-area-inset-bottom, 24px) 16px;
      transition: background-image 0.4s ease-in-out;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      filter: brightness(1.18);
    }

    /* Trên Máy Tính (Desktop / Laptop): Đồ họa Khung viền Mi 11 Ultra căn giữa trên nền Đen tuyền */
    @media (min-width: 768px) {
      body {
        background: #000000 !important;
        padding: 20px;
      }
      
      .phone-frame {
        width: 100%;
        max-width: 410px;
        height: 850px;
        max-height: 92vh;
        border-radius: 44px;
        overflow: hidden;
        box-shadow: 0 0 0 10px #181820, 0 0 0 12px rgba(255, 255, 255, 0.15), 0 30px 80px rgba(0, 0, 0, 0.95);
        padding: 30px 20px;
      }
    }

    /* Trên Điện Thoại Mobile: Trải rộng 100% toàn màn hình căn chuẩn */
    @media (max-width: 767px) {
      body {
        background: #000000 !important;
      }
      
      .phone-frame {
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* Dark Vignette Overlay mỏng nhẹ */
    .bg-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.25) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Wrapper chính giữ toàn bộ nội dung căn giữa gọn gàng ở nửa dưới */
    .main-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 320px;
      gap: 10px;
      user-select: none;
      animation: fadeIn 0.4s ease-out;
    }

    /* Logo Web & App */
    .app-logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 2px;
    }

    .app-logo {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      object-fit: cover;
      background: #ffffff;
      padding: 3px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(255, 255, 255, 0.3);
      transition: transform 0.25s ease;
    }

    .app-logo:hover {
      transform: scale(1.06);
    }

    /* Tên chủ tài khoản đè trực tiếp lên ảnh nền */
    .account-name {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    /* Số tài khoản đè trực tiếp lên ảnh nền, đậm nét rõ ràng */
    .account-number {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1.8px;
      font-family: 'SF Mono', 'Roboto Mono', monospace;
      cursor: pointer;
      display: inline-block;
      padding: 0 4px;
      background: transparent;
      border: none;
      box-shadow: none;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 0, 0, 0.8);
      transition: transform 0.2s ease;
    }

    .account-number:active {
      transform: scale(0.95);
    }

    .qr-frame {
      background: #ffffff;
      padding: 8px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 165px;
      height: 165px;
      margin: 2px 0;
    }

    .qr-image {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      display: block;
      pointer-events: none;
    }

    /* Dots Indicator - Hoàn toàn trong suốt, các chấm tròn nổi đè trực tiếp lên hình nền */
    .dots-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      max-width: 100%;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 4px 8px;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: none;
      box-shadow: none;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
    }

    .dot.active {
      width: 7px;
      height: 7px;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 2px 5px rgba(0, 0, 0, 0.8);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: calc(25px + env(safe-area-inset-bottom, 0px));
      z-index: 100;
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Tối ưu vị trí cân đối trên màn hình Mi 11 Ultra */
    @media (min-height: 800px) {
      .main-wrapper { gap: 12px; }
    }
  </style>
</head>
<body>

  <!-- Khung mô phỏng Mi 11 Ultra -->
  <div class="phone-frame" id="phoneFrame">
    <div class="bg-overlay"></div>

    <div class="main-wrapper">
      <!-- Logo Web & App -->
      <div class="app-logo-container">
        <img src="logo.jpg" alt="Logo" class="app-logo">
      </div>

      <!-- Tên & Số tài khoản đè trực tiếp lên bức ảnh nền -->
      <div class="account-name">NGUYEN DUC MANH</div>
      
      <div class="account-number" onclick="copySTK(event)" title="Bấm để sao chép số tài khoản">2026 2027 202</div>

      <!-- Khung QR với chữ M ở chính giữa -->
      <div class="qr-frame">
        <img class="qr-image" src="https://img.vietqr.io/image/TPB-20262027202-qr_only.png" alt="Mã QR TPBank NGUYEN DUC MANH">
      </div>

      <!-- Dải chấm tròn chọn hình nền -->
      <div class="dots-container" id="dotsContainer"></div>
    </div>
  </div>

  <div id="toast" class="toast">Đã sao chép số tài khoản!</div>

  <script>
    const wallpapers = [
      'img/954200239789131404.jpg',
      'img/454863631138731052.jpg',
      'img/bg_daisy.jpg',
      'img/759701030913767782.jpg',
      'img/971651688338996661.jpg',
      'img/973692381950275438.jpg',
      'img/790100328393841185.jpg',
      'img/935974735068844819.jpg',
      'img/1100145015255767390.jpg',
      'img/316800155049851743.jpg',
      'img/889038782735729567.jpg',
      'img/913738211895783226.jpg',
      'img/949063321487275333.jpg'
    ];

    // Đọc đường dẫn ảnh đã lưu (Lưu theo tên file ảnh chính xác để luôn luôn mở đúng ảnh A)
    let currentBgIndex = 0;
    try {
      const savedPath = localStorage.getItem('saved_bg_path');
      if (savedPath && wallpapers.includes(savedPath)) {
        currentBgIndex = wallpapers.indexOf(savedPath);
      } else {
        const savedIndex = parseInt(localStorage.getItem('saved_bg_index') || '0', 10);
        if (!isNaN(savedIndex) && savedIndex >= 0 && savedIndex < wallpapers.length) {
          currentBgIndex = savedIndex;
        }
      }
    } catch (e) {
      currentBgIndex = 0;
    }

    function renderDots() {
      const c = document.getElementById('dotsContainer');
      if (!c) return;
      c.innerHTML = '';
      wallpapers.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = `dot ${i === currentBgIndex ? 'active' : ''}`;
        d.onclick = e => { e.stopPropagation(); applyWallpaper(i); };
        c.appendChild(d);
      });
    }

    function applyWallpaper(i) {
      currentBgIndex = i;
      const targetPath = wallpapers[i];
      const bgUrl = `url('${targetPath}')`;
      const frame = document.getElementById('phoneFrame');
      if (frame) frame.style.backgroundImage = bgUrl;
      
      try {
        localStorage.setItem('saved_bg_path', targetPath);
        localStorage.setItem('saved_bg_index', i.toString());
      } catch (e) {}

      renderDots();
    }

    function next() { applyWallpaper((currentBgIndex + 1) % wallpapers.length); }
    function prev() { applyWallpaper((currentBgIndex - 1 + wallpapers.length) % wallpapers.length); }

    // Vuốt màn hình sang trái / phải
    let sx = 0, sy = 0, swiped = false;
    document.addEventListener('touchstart', e => { sx = e.changedTouches[0].screenX; sy = e.changedTouches[0].screenY; swiped = false; });
    document.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].screenX - sx;
      const dy = e.changedTouches[0].screenY - sy;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
        swiped = true;
        dx < 0 ? next() : prev();
      }
    });

    // Chạm bên trái / bên phải màn hình
    document.addEventListener('click', e => {
      if (swiped) { swiped = false; return; }
      if (e.target.closest('.account-number') || e.target.closest('.dots-container')) return;
      e.clientX < window.innerWidth / 2 ? prev() : next();
    });

    // Bàn phím Mũi tên
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft') prev();
    });

    function copySTK(e) {
      if (e) e.stopPropagation();
      navigator.clipboard.writeText("20262027202").then(() => {
        const t = document.getElementById('toast');
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
      });
    }

    applyWallpaper(currentBgIndex);
  </script>
</body>
</html>
