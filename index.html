<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QR TPBank - NGUYEN DUC MANH</title>
  
  <!-- Apple Touch Icon & Favicon -->
  <link rel="apple-touch-icon" href="https://img.vietqr.io/image/TPB-20262027202-qr_only.png">
  <link rel="icon" type="image/png" href="https://api.vietqr.io/img/TPB.png">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22QR%20TPBank%22%2C%22short_name%22%3A%22QR%20Pay%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fimg.vietqr.io%2Fimage%2FTPB-20262027202-qr_only.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0d0d11;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: 20px;
      color: #ffffff;
      position: relative;
      overflow-x: hidden;
      transition: background-image 0.5s ease-in-out;
    }

    /* Dark Vignette Overlay */
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0.75) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Glassmorphism Main QR Container */
    .qr-card {
      position: relative;
      z-index: 10;
      background: rgba(18, 18, 24, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 28px 24px;
      border-radius: 28px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      width: 100%;
      max-width: 340px;
      text-align: center;
      animation: scaleUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .account-name {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .account-number {
      font-size: 16px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 20px;
      letter-spacing: 1.5px;
      font-family: monospace;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.2s ease;
    }

    .account-number:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .account-number:active {
      transform: scale(0.96);
    }

    /* Khung chứa mã QR màu trắng tinh khiết */
    .qr-frame {
      background: #ffffff;
      padding: 14px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-image {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      display: block;
    }

    /* Nút đổi hình nền nhanh */
    .wallpaper-bar {
      position: relative;
      z-index: 10;
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 30px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      transition: all 0.2s ease;
    }

    .wallpaper-bar:hover {
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 30px;
      z-index: 100;
      background: #0f172a;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Dark Background Vignette -->
  <div class="bg-overlay"></div>

  <!-- QR Card -->
  <div class="qr-card">
    <div class="account-name">NGUYEN DUC MANH</div>
    <div class="account-number" onclick="copySTK()" title="Bấm để sao chép số tài khoản">
      <span>2026 2027 202</span>
      <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
    </div>
    
    <!-- Khung nền trắng chứa mã QR đen chuẩn 100% -->
    <div class="qr-frame">
      <img class="qr-image" src="https://img.vietqr.io/image/TPB-20262027202-qr_only.png" alt="Mã QR TPBank NGUYEN DUC MANH">
    </div>
  </div>

  <!-- Nút đổi hình nền nhanh -->
  <div class="wallpaper-bar" onclick="nextWallpaper()" title="Bấm để đổi hình nền">
    <span>🖼️ Đổi hình nền</span>
    <span id="bgIndexTag" style="font-size: 11px; opacity: 0.7;">(1/12)</span>
  </div>

  <div id="toast" class="toast">Đã sao chép số tài khoản!</div>

  <script>
    // Danh sách 12 hình nền trong folder img
    const wallpapers = [
      'img/137008013658937884.jpg',
      'img/954200239789131404.jpg',
      'img/454863631138731052.jpg',
      'img/bg_daisy.jpg',
      'img/759701030913767782.jpg',
      'img/971651688338996661.jpg',
      'img/973692381950275438.jpg',
      'img/800233427586822769.jpg',
      'img/935904366330998579.jpg',
      'img/790100328393841185.jpg',
      'img/935974735068844819.jpg',
      'img/1100145015255767390.jpg'
    ];

    let currentBgIndex = parseInt(localStorage.getItem('saved_bg_index') || '0', 10);
    if (isNaN(currentBgIndex) || currentBgIndex < 0 || currentBgIndex >= wallpapers.length) {
      currentBgIndex = 0;
    }

    function applyWallpaper(index) {
      document.body.style.backgroundImage = `url('${wallpapers[index]}')`;
      document.getElementById('bgIndexTag').innerText = `(${index + 1}/${wallpapers.length})`;
      localStorage.setItem('saved_bg_index', index.toString());
    }

    function nextWallpaper() {
      currentBgIndex = (currentBgIndex + 1) % wallpapers.length;
      applyWallpaper(currentBgIndex);
    }

    function copySTK() {
      navigator.clipboard.writeText("20262027202").then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }

    // Khởi tạo hình nền ban đầu
    applyWallpaper(currentBgIndex);
  </script>
</body>
</html>
